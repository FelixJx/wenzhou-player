<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 主角头像｜与全身立绘同一套五官规范 -->
  <defs>
    <clipPath id="heroAv"><circle cx="50" cy="50" r="47"/></clipPath>
    <radialGradient id="avSkin" cx="34%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#FEE2C4"/>
      <stop offset="52%" stop-color="#F7CCA4"/>
      <stop offset="100%" stop-color="#E2A67A"/>
    </radialGradient>
    <linearGradient id="avHair" x1="16%" y1="0%" x2="84%" y2="100%">
      <stop offset="0%" stop-color="#70553F"/>
      <stop offset="46%" stop-color="#4B382A"/>
      <stop offset="100%" stop-color="#2F221A"/>
    </linearGradient>
    <linearGradient id="avCollar" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="60%" stop-color="#F3ECDF"/>
      <stop offset="100%" stop-color="#D9CDBB"/>
    </linearGradient>
    <radialGradient id="avBlush">
      <stop offset="0%" stop-color="#F58585" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#F58585" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="47" fill="#FFC86F"/>
  <circle cx="50" cy="46" r="40" fill="#FFD793" opacity=".5"/>

  <g clip-path="url(#heroAv)">
    <!-- 肩膀 / 领口 -->
    <path d="M16 100c5-15 16-22 34-22s29 7 34 22Z" fill="url(#avCollar)"/>
    <path d="M50 78c18 0 29 7 34 22H50Z" fill="#DACEB9" opacity=".45"/>
    <path d="M41 76q9 7.4 18 0" fill="none" stroke="#B5A88F" stroke-width="2" stroke-linecap="round"/>

    <!-- 脖子 + 下巴投影 -->
    <path d="M40 60h20v18H40Z" fill="#E3A97D"/>
    <ellipse cx="50" cy="76" rx="17" ry="6" fill="#C98A5E" opacity=".42"/>

    <!-- 头 -->
    <ellipse cx="50" cy="46" rx="31.5" ry="32" fill="url(#avSkin)"/>
    <path d="M50 14a31.5 31.5 0 0 1 0 64 23 23 0 0 0 0-64Z" fill="#DFA377" opacity=".32"/>

    <!-- 耳朵 -->
    <ellipse cx="20.4" cy="50" rx="4.6" ry="6.2" fill="#F3C29A"/>
    <ellipse cx="20.4" cy="50" rx="2.3" ry="3.6" fill="#DEA173" opacity=".75"/>
    <ellipse cx="79.6" cy="50" rx="4.6" ry="6.2" fill="#E4AD81"/>

    <!-- 头发 -->
    <path d="M50 14c17.4 0 30 11 31.2 26.4.2 2.6-.3 4.9-.9 6.6-2.1-8.6-7.4-13.8-14.4-15.2-4.4 3-10 4.5-16.2 4.5-7.1 0-13.1-1.9-17.6-5.7-6 2-10.3 7.6-12 16.4-.6-1.8-1-4.1-.9-6.6C20 25 32.6 14 50 14Z"
          fill="url(#avHair)"/>
    <path d="M27.4 24.6c-4 3.4-6.4 7.8-7.6 13.6M40.6 20c-3.2 2.6-5.4 6.6-6 10.8M62.6 20.6c3.4 2.4 6 6.2 7 10.4"
          fill="none" stroke="#2A1E15" stroke-width="1.7" stroke-linecap="round" opacity=".5"/>
    <path d="M32 25.4c4.8-4.8 11-7.4 17.6-7.4 2.8 0 5.6.5 8.2 1.4-6.4 1.2-11.6 4-15.4 8.4-3.8.4-7.2-.5-10.4-2.4Z"
          fill="#8C6C53" opacity=".7"/>
    <path d="M35.6 24.4c3.8-3 8.2-4.8 12.6-5" fill="none" stroke="#B3906F" stroke-width="2" stroke-linecap="round" opacity=".85"/>
    <!-- 呆毛 -->
    <path d="M53 15.4c1.8-7.4 6.8-11 11.8-9.2" fill="none" stroke="#4B382A" stroke-width="3" stroke-linecap="round"/>
    <path d="M54 14c1.4-5 5-7.6 8.8-7" fill="none" stroke="#8C6C53" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
    <!-- 鬓角 -->
    <path d="M20.6 30.6c-1.8 7-.4 12.6 1.8 17.4-4.4-1.6-7.4-6-8-11.6-.4-3.2.6-6 2.2-8.4Z" fill="#3F2E22"/>
    <path d="M79.4 30.6c1.8 7 .4 12.6-1.8 17.4 4.4-1.6 7.4-6 8-11.6.4-3.2-.6-6-2.2-8.4Z" fill="#33251B"/>

    <!-- 眉毛 -->
    <path d="M29.6 44.2q5.2-2.8 10.4-.6M70.4 44.2q-5.2-2.8-10.4-.6"
          fill="none" stroke="#3C2C20" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 左眼 -->
    <ellipse cx="37.4" cy="53" rx="7.4" ry="8.6" fill="#FFFCF5"/>
    <ellipse cx="37.4" cy="53" rx="7.4" ry="8.6" fill="none" stroke="#C58F63" stroke-width="1" opacity=".45"/>
    <ellipse cx="37.9" cy="53.5" rx="5.1" ry="6.3" fill="#3A2B20"/>
    <ellipse cx="37.9" cy="54.6" rx="3.3" ry="4.1" fill="#1F1610"/>
    <circle cx="35.4" cy="50" r="2.3" fill="#FFFFFF"/>
    <circle cx="40.4" cy="57" r="1.2" fill="#FFFFFF" opacity=".85"/>
    <path d="M28.8 48.4q3.7-4.7 8.9-4.7 3.8 0 6.7 2.4" fill="none" stroke="#2A1D15" stroke-width="2.7" stroke-linecap="round"/>
    <path d="M29.2 47.4 26.8 45.4" fill="none" stroke="#2A1D15" stroke-width="2" stroke-linecap="round"/>
    <path d="M30 58.4q6 4 12 .6" fill="none" stroke="#C58F63" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>

    <!-- 右眼 -->
    <ellipse cx="62.6" cy="53" rx="7.4" ry="8.6" fill="#FBF5EC"/>
    <ellipse cx="62.6" cy="53" rx="7.4" ry="8.6" fill="none" stroke="#B57E55" stroke-width="1" opacity=".4"/>
    <ellipse cx="62.1" cy="53.5" rx="5.1" ry="6.3" fill="#31241A"/>
    <ellipse cx="62.1" cy="54.6" rx="3.3" ry="4.1" fill="#1A120D"/>
    <circle cx="59.6" cy="50" r="2.2" fill="#FFFFFF" opacity=".95"/>
    <circle cx="64.6" cy="57" r="1.1" fill="#FFFFFF" opacity=".75"/>
    <path d="M71.2 48.4q-3.7-4.7-8.9-4.7-3.8 0-6.7 2.4" fill="none" stroke="#2A1D15" stroke-width="2.7" stroke-linecap="round"/>
    <path d="M70.8 47.4 73.2 45.4" fill="none" stroke="#2A1D15" stroke-width="2" stroke-linecap="round"/>
    <path d="M70 58.4q-6 4-12 .6" fill="none" stroke="#B57E55" stroke-width="1.2" stroke-linecap="round" opacity=".45"/>

    <!-- 鼻 -->
    <path d="M50.6 61q-2 2.6.6 3.4" fill="none" stroke="#C98757" stroke-width="1.9" stroke-linecap="round" opacity=".65"/>
    <ellipse cx="50.8" cy="64.4" rx="2.8" ry="1.5" fill="#D2915F" opacity=".22"/>

    <!-- 腮红 -->
    <ellipse cx="27.6" cy="63.4" rx="8.6" ry="6.4" fill="url(#avBlush)"/>
    <ellipse cx="72.4" cy="63.4" rx="8.6" ry="6.4" fill="url(#avBlush)" opacity=".85"/>

    <!-- 嘴 -->
    <path d="M44 68.4q6 4.8 12 0" fill="none" stroke="#B25E4A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M46 69q4 2.6 8 0" fill="#E8837A" opacity=".5"/>
    <path d="M47.4 71.4q2.6 1.3 5.2 0" fill="none" stroke="#FFDCD1" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>

    <!-- 边缘光 -->
    <path d="M22.6 34c1.6-5.6 4.6-9.8 8.6-12.6" fill="none" stroke="#C9A282" stroke-width="1.8" stroke-linecap="round" opacity=".6"/>
  </g>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#2E3A33" stroke-width="3"/>
</svg>
