<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 柴犬老板头像｜与全身立绘同一套规范 -->
  <defs>
    <clipPath id="shopAv"><circle cx="50" cy="50" r="47"/></clipPath>
    <linearGradient id="avDogFur" x1="16%" y1="4%" x2="86%" y2="98%">
      <stop offset="0%" stop-color="#F0B67B"/>
      <stop offset="46%" stop-color="#D9914F"/>
      <stop offset="100%" stop-color="#B06D2F"/>
    </linearGradient>
    <linearGradient id="avDogFace" x1="30%" y1="18%" x2="76%" y2="88%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="62%" stop-color="#F7EFDF"/>
      <stop offset="100%" stop-color="#E2D3B9"/>
    </linearGradient>
    <linearGradient id="avDogCollar" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FDFAF2"/>
      <stop offset="60%" stop-color="#F0E8D8"/>
      <stop offset="100%" stop-color="#D6C9B4"/>
    </linearGradient>
    <radialGradient id="avDogBlush">
      <stop offset="0%" stop-color="#EE8A72" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#EE8A72" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="47" fill="#D9914F"/>
  <circle cx="50" cy="46" r="40" fill="#E0A05E" opacity=".55"/>

  <g clip-path="url(#shopAv)">
    <!-- 肩膀 -->
    <path d="M14 100c5-15 17-22 36-22s31 7 36 22Z" fill="url(#avDogCollar)"/>
    <path d="M50 78c19 0 31 7 36 22H50Z" fill="#D5C8B2" opacity=".45"/>
    <!-- 毛领 -->
    <path d="M36 76c3.6 5 8.6 8 14 8s10.4-3 14-8c-3.4 9-8.2 12.6-14 12.6S39.4 85 36 76Z"
          fill="url(#avDogFace)" stroke="#C48343" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- 脖子 -->
    <path d="M41 58h18v20H41Z" fill="#C48343"/>
    <ellipse cx="50" cy="76" rx="16" ry="5.6" fill="#A56933" opacity=".38"/>

    <!-- 耳朵 -->
    <path d="M22.6 31.4c-4.6-12.4-1-21 6.6-19.8 6.6 1 10.8 9.4 11.8 17.6Z"
          fill="url(#avDogFur)" stroke="#A56933" stroke-width="2" stroke-linejoin="round"/>
    <path d="M77.4 31.4c4.6-12.4 1-21-6.6-19.8-6.6 1-10.8 9.4-11.8 17.6Z"
          fill="#C48343" stroke="#96602C" stroke-width="2" stroke-linejoin="round"/>
    <path d="M27 27.4c-2.6-6.6-.6-11 2.9-10.5 3.1.4 5.2 4.8 6 9.2Z" fill="#F0B98A"/>
    <path d="M73 27.4c2.6-6.6.6-11-2.9-10.5-3.1.4-5.2 4.8-6 9.2Z" fill="#D99257"/>

    <!-- 头 -->
    <ellipse cx="50" cy="46" rx="31.5" ry="32" fill="url(#avDogFur)"/>
    <path d="M50 14a31.5 31.5 0 0 1 0 64 23 23 0 0 0 0-64Z" fill="#B06D2F" opacity=".28"/>

    <!-- 白脸 -->
    <!-- 白脸：只覆盖鼻梁以下到下巴，额头留棕 -->
    <path d="M50 43.6c8.8 0 15.4 6.4 15.4 15.4 0 12.4-6.9 21.4-15.4 21.4s-15.4-9-15.4-21.4c0-9 6.6-15.4 15.4-15.4Z"
          fill="url(#avDogFace)"/>
    <path d="M50 43.6c8.8 0 15.4 6.4 15.4 15.4 0 12.4-6.9 21.4-15.4 21.4V43.6Z" fill="#E2D3B9" opacity=".4"/>
    <path d="M50 43.6c8.8 0 15.4 6.4 15.4 15.4 0 12.4-6.9 21.4-15.4 21.4s-15.4-9-15.4-21.4c0-9 6.6-15.4 15.4-15.4Z"
          fill="none" stroke="#C48343" stroke-width="1.3" opacity=".5"/>

    <!-- 眉点 -->
    <ellipse cx="36.4" cy="39.4" rx="3.6" ry="2.4" fill="#FFFDF7" opacity=".95"/>
    <ellipse cx="63.6" cy="39.4" rx="3.6" ry="2.4" fill="#FFFDF7" opacity=".8"/>

    <!-- 眼睛 -->
    <ellipse cx="36.8" cy="51.6" rx="5" ry="5.8" fill="#2F231A"/>
    <ellipse cx="63.2" cy="51.6" rx="5" ry="5.8" fill="#291E16"/>
    <circle cx="34.8" cy="49.4" r="2" fill="#FFFFFF"/>
    <circle cx="61.2" cy="49.4" r="1.9" fill="#FFFFFF" opacity=".95"/>
    <circle cx="39.2" cy="54.4" r="1.1" fill="#FFFFFF" opacity=".6"/>
    <circle cx="65.6" cy="54.4" r="1" fill="#FFFFFF" opacity=".55"/>

    <!-- 鼻子 -->
    <path d="M50 58.4c3.2 0 5.6 2 5.6 4.4s-2.4 4-5.6 4-5.6-1.6-5.6-4 2.4-4.4 5.6-4.4Z" fill="#3A2E26"/>
    <ellipse cx="48.2" cy="60.2" rx="1.7" ry="1.1" fill="#8E8078" opacity=".75"/>

    <!-- 嘴 -->
    <path d="M50 66.8v3.2M50 70q-5.2 4-9 .4M50 70q5.2 4 9 .4"
          fill="none" stroke="#4A3B2E" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 胡须 -->
    <path d="M30 63 38.4 64.2M30.6 67.6 38.4 66.2M70 63 61.6 64.2M69.4 67.6 61.6 66.2"
          stroke="#B8A48C" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>

    <!-- 腮红 -->
    <ellipse cx="27" cy="62" rx="8" ry="5.6" fill="url(#avDogBlush)"/>
    <ellipse cx="73" cy="62" rx="8" ry="5.6" fill="url(#avDogBlush)" opacity=".8"/>

    <!-- 边缘光 -->
    <path d="M22.6 32c1.4-5.4 4.2-9.4 8-12" fill="none" stroke="#E8C09A" stroke-width="1.7" stroke-linecap="round" opacity=".6"/>
  </g>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#2E3A33" stroke-width="3"/>
</svg>
