# /etc/nginx/conf.d/wenzhou-limit.conf —— limit_req_zone / log_format 必须在 http 级别声明，
# conf.d/*.conf 正好被 nginx.conf 的 http 块 include，所以单独放一个文件。
limit_req_zone $binary_remote_addr zone=wz_troubles:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=wz_api:1m rate=60r/m;

# 不记录客户端 IP 的访问日志格式（REVIEW M5）
log_format wz_noip '$time_local "$request" $status $body_bytes_sent $request_time';
