# /etc/nginx/conf.d/wenzhou.conf
# 《温州玩家 · 1024分钟》独立 vhost。域名占位 play.yaosenai.cn，替换方法见 deploy/README.md。
# 静态文件（/play, /content）与 API 都由 Node 服务（127.0.0.1:8790）处理，nginx 只做 TLS 终止与反代。

# 80 → 443 跳转（certbot 的 http-01 验证路径放行）
server {
    listen 80;
    listen [::]:80;
    server_name play.yaosenai.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name play.yaosenai.cn;

    # certbot 签发后会生成以下路径；首次部署前先用 `certbot --nginx -d play.yaosenai.cn` 或手动填入
    # ssl_certificate     /etc/letsencrypt/live/play.yaosenai.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/play.yaosenai.cn/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;
    # wz_noip 格式不含 $remote_addr（定义在 wenzhou-limit.conf）
    access_log /var/log/nginx/wenzhou.access.log wz_noip;
    error_log  /var/log/nginx/wenzhou.error.log warn;

    # 对困扰提交做一层 nginx 限流（Node 内部另有 10/min/IP）
    location = /api/troubles {
        limit_req zone=wz_troubles burst=5 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/conf.d/wenzhou-proxy.inc;
    }

    # /api/ 整体限流（Node 内部另有 runs 20/min、celebrity 6/min）
    location /api/ {
        limit_req zone=wz_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/conf.d/wenzhou-proxy.inc;
    }

    # 二维码/口播常省略尾斜杠；index.html 用相对路径 ../content，必须带斜杠（Node 侧也有同样的 301）
    location = /play {
        return 301 /play/;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/conf.d/wenzhou-proxy.inc;
    }
}
